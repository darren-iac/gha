name: Build immutable image

# Organization-wide image build contract. Source repositories own tests and
# decide when this workflow runs; darren-iac/iac owns image selection and
# deployment through Flux image automation.

on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub repository, for example darren/ocr-swipe
        required: true
        type: string
      context:
        description: Build context relative to the caller repository
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile relative to the caller repository
        required: false
        default: Dockerfile
        type: string
      platforms:
        description: Comma-separated target platforms
        required: false
        default: linux/amd64
        type: string
      build-args:
        description: Newline-separated Docker build arguments
        required: false
        default: ''
        type: string
      build-contexts:
        description: Newline-separated BuildKit named contexts
        required: false
        default: ''
        type: string
      target:
        description: Optional Dockerfile target stage
        required: false
        default: ''
        type: string
      runner:
        description: Runner label; override only for a capability-specific pool
        required: false
        default: arc-runners-darren-iac
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      tag:
        description: Immutable tag pushed by this invocation
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: OCI digest produced by Buildx
        value: ${{ jobs.build.outputs.digest }}
      reference:
        description: Immutable tag plus digest
        value: ${{ jobs.build.outputs.reference }}

permissions:
  contents: read

concurrency:
  group: image-${{ github.repository }}-${{ inputs.image }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
      reference: ${{ steps.result.outputs.reference }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        name: Compute immutable sortable tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a full commit SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}"
          else
            tag="git-$(date -u +%s)-${GITHUB_SHA}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Building docker.io/${{ inputs.image }}:${tag}"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - id: build
        name: Build and push ${{ inputs.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          build-contexts: ${{ inputs.build-contexts }}
          target: ${{ inputs.target }}
          push: true
          tags: docker.io/${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          outputs: type=image,oci-mediatypes=true
          cache-from: type=registry,ref=docker.io/${{ inputs.image }}:buildcache
          cache-to: type=registry,ref=docker.io/${{ inputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - id: result
        name: Report immutable result
        shell: bash
        run: |
          set -euo pipefail
          reference="docker.io/${{ inputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.build.outputs.digest }}"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"
          echo "Built ${reference}"
