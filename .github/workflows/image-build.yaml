name: Build immutable image

# Organization-wide image build contract. Source repositories own tests and
# decide when this workflow runs; darren-iac/iac owns image selection and
# deployment through Flux image automation. Before any push, the workflow
# creates a missing Docker Hub repository privately and fails closed if an
# existing repository is public.
#
# Credentials are chosen HERE, by event, never by the caller:
#   pull_request  -> DOCKERHUB_READ_TOKEN. Build and read the cache only: no
#                    push, no cache write, no repository creation. PR code is
#                    untrusted, and a write token would let it poison the shared
#                    :buildcache that trusted builds import.
#   anything else -> DOCKERHUB_WRITE_TOKEN. Push the immutable tag and the cache.
# Callers pass `secrets: inherit`; per-repository secrets supply all three
# values (darren-iac/iac tofu/github/dockerhub_ci_credentials.tf). Not
# organization secrets: on GitHub Free those never reach a private repository.

on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub repository, for example darren/ocr-swipe
        required: true
        type: string
      context:
        description: Build context relative to the caller repository
        required: false
        default: .
        type: string
      dockerfile:
        description: Dockerfile relative to the caller repository
        required: false
        default: Dockerfile
        type: string
      platforms:
        description: Comma-separated target platforms
        required: false
        default: linux/amd64
        type: string
      build-args:
        description: Newline-separated Docker build arguments
        required: false
        default: ''
        type: string
      build-contexts:
        description: Newline-separated BuildKit named contexts
        required: false
        default: ''
        type: string
      upstream-repo:
        description: >-
          Optional Git repository for a named `upstream` context. The workflow
          reads its pinned 40-character SHA from <context>/docker-bake.hcl.
        required: false
        default: ''
        type: string
      target:
        description: Optional Dockerfile target stage
        required: false
        default: ''
        type: string
      runner:
        description: Runner label; override only for a capability-specific pool
        required: false
        default: arc-runners-darren-iac
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_READ_TOKEN:
        description: Read-only Docker Hub token; used for pull_request builds
        required: true
      DOCKERHUB_WRITE_TOKEN:
        description: >-
          Read/write Docker Hub token; used for every trusted build. Optional
          only so that a pull_request build never needs it; a trusted build
          without it fails closed.
        required: false
    outputs:
      tag:
        description: Immutable tag pushed by this invocation (empty for pull_request)
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: OCI digest produced by Buildx
        value: ${{ jobs.build.outputs.digest }}
      reference:
        description: Immutable tag plus digest
        value: ${{ jobs.build.outputs.reference }}

permissions:
  contents: read

concurrency:
  group: image-${{ github.repository }}-${{ inputs.image }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
      reference: ${{ steps.result.outputs.reference }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        name: Choose credentials and compute the immutable tag
        shell: bash
        env:
          HAS_WRITE_TOKEN: ${{ secrets.DOCKERHUB_WRITE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a full commit SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == pull_request* ]]; then
            # Build-only: nothing is pushed, so there is no tag.
            echo "trusted=false" >> "${GITHUB_OUTPUT}"
            echo "tag=" >> "${GITHUB_OUTPUT}"
            echo "Pull request: read-only build of docker.io/${{ inputs.image }}, no push"
          else
            if [[ "${HAS_WRITE_TOKEN}" != "true" ]]; then
              echo "::error::${GITHUB_EVENT_NAME} is a trusted build but DOCKERHUB_WRITE_TOKEN is empty. Call this workflow with 'secrets: inherit'."
              exit 1
            fi
            tag="git-$(date -u +%s)-${GITHUB_SHA}"
            echo "trusted=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "Building docker.io/${{ inputs.image }}:${tag}"
          fi

      - name: Ensure Docker Hub repository is private
        if: steps.meta.outputs.trusted == 'true'
        uses: darren-iac/gha/.github/actions/ensure-dockerhub-private@a5d9c5768c262370b5b64eeefbf1948d513be71c
        with:
          repo: ${{ inputs.image }}
          dockerhub-token: ${{ secrets.DOCKERHUB_WRITE_TOKEN }}

      # Inline rather than docker/login-action, which has no retry. Docker Hub
      # rate-limits logins per egress IP, and every runner shares one, so a
      # burst of builds fails AT LOGIN for a reason unrelated to any image.
      - name: Log in to Docker Hub (${{ steps.meta.outputs.trusted == 'true' && 'read/write' || 'read-only' }})
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ steps.meta.outputs.trusted == 'true' && secrets.DOCKERHUB_WRITE_TOKEN || secrets.DOCKERHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          n=0
          until printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin; do
            n=$((n + 1))
            if [ "$n" -ge 6 ]; then
              echo "::error::docker login failed after ${n} attempts"
              exit 1
            fi
            # Hub's per-IP window is minutes: 15/60/135/240/375 s.
            delay=$((15 * n * n))
            echo "docker login attempt ${n} failed; retrying in ${delay}s" >&2
            sleep "${delay}"
          done

      - id: upstream
        name: Resolve pinned upstream build context
        if: inputs.upstream-repo != ''
        shell: bash
        run: |
          set -euo pipefail
          bake_file="${{ inputs.context }}/docker-bake.hcl"
          ref=$(grep -E '^\s*default\s*=' "${bake_file}" \
            | grep -E '[0-9a-f]{40}' \
            | head -1 \
            | sed -E 's/.*"([0-9a-f]{40})".*/\1/')
          if [[ ! "${ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not parse a full upstream SHA from ${bake_file}" >&2
            exit 1
          fi
          echo "context=upstream=${{ inputs.upstream-repo }}#${ref}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - id: build
        name: Build ${{ steps.meta.outputs.trusted == 'true' && 'and push ' || '(no push) ' }}${{ inputs.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          build-contexts: |
            ${{ inputs.build-contexts }}
            ${{ steps.upstream.outputs.context }}
          target: ${{ inputs.target }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=docker.io/${{ inputs.image }}:buildcache
          # Trusted: push the immutable tag and the cache. Pull request:
          # `cacheonly` builds every stage and exports nothing, and there is no
          # cache-to, so the read-only token is never asked to write.
          push: ${{ steps.meta.outputs.trusted == 'true' }}
          tags: ${{ steps.meta.outputs.trusted == 'true' && format('docker.io/{0}:{1}', inputs.image, steps.meta.outputs.tag) || '' }}
          outputs: ${{ steps.meta.outputs.trusted == 'true' && 'type=image,oci-mediatypes=true' || 'type=cacheonly' }}
          provenance: ${{ steps.meta.outputs.trusted == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.meta.outputs.trusted == 'true' }}
          cache-to: ${{ steps.meta.outputs.trusted == 'true' && format('type=registry,ref=docker.io/{0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', inputs.image) || '' }}

      - id: result
        name: Report result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.meta.outputs.trusted }}" != "true" ]]; then
            echo "reference=" >> "${GITHUB_OUTPUT}"
            echo "Pull request build of docker.io/${{ inputs.image }} succeeded; nothing pushed"
            exit 0
          fi
          reference="docker.io/${{ inputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.build.outputs.digest }}"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"
          echo "Built ${reference}"
